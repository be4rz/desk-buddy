<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>desk-buddy music</title>
<link rel="stylesheet" href="/sdk/widget.css">
<link rel="stylesheet" href="media.css">
<script src="/sdk/buddy-widget.js"></script>
<script src="media.js" defer></script>
</head>
<body>
<div class="widget" id="w" data-view="empty">
  <div class="wbar" data-widget-drag><span>♪ Music</span><span class="acts"><button id="hide" title="hide (keeps playing)" aria-label="hide (keeps playing)">–</button><button id="close" title="close" aria-label="close">✕</button></span></div>
  <div class="video" id="video"><div id="player"></div></div>
  <div class="ctrls" id="ctrls"><button class="cbtn" id="pp" aria-label="pause">❚❚</button><button class="cbtn next" id="next" aria-label="next">⏭</button><div class="t"><b id="title">…</b><small id="sub">YouTube · requested by the bear</small></div></div>
  <div class="bar" id="bar"><i id="prog"></i></div>
  <div class="empty" id="empty"><b>Nothing playing</b>Ask the bear, e.g. “play some jazz”, or run <code>buddy music play jazz</code>.</div>
  <div class="empty" id="error"><b class="err">This video can't play here</b><span id="errtext">Its owner blocks embedding (error 150). Opened it in the browser widget instead.</span></div>
  <div class="row" id="errrow"><button class="btn" id="pick">Pick another</button></div>
</div>
</body>
</html>
