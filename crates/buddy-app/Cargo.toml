[package]
name = "buddy-app"
description = "desk-buddy: the menu-bar app (Tauri 2 + native NSPanel bear), from spike S1"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = ["tray-icon", "image-png", "custom-protocol", "macos-private-api", "unstable"] }
serde.workspace = true
serde_json.workspace = true
libc = "0.2"
# the screen look picture (screen/frame.rs); already in the lock for mascot-render and studio
png = "0.17"
mascot-protocol.workspace = true
mascot-core.workspace = true
mascot-render = { path = "../mascot-render" }
bridge.workspace = true
host.workspace = true
policy.workspace = true
widgets.workspace = true
studio.workspace = true
memory.workspace = true
jiff = "0.2"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-quartz-core = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"
objc2-web-kit = { version = "0.3", features = ["WKWebViewConfiguration", "objc2-app-kit"] }
# screen look (screen/capture.rs, screen/ocr.rs): ScreenCaptureKit screenshot + Vision text recognition
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = ["std", "SCScreenshotManager", "SCShareableContent", "SCStream", "libc", "block2", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-vision = { version = "0.3", default-features = false, features = ["std", "VNRequest", "VNRecognizeTextRequest", "VNRequestHandler", "VNObservation", "VNTypes", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-io-surface = { version = "0.3", features = ["libc", "objc2-core-foundation"] }

[dev-dependencies]
# the IPC ACL test (widgets::acl): a mock runtime with the app's real capabilities
tauri = { version = "=2.12.4", features = ["test"] }
