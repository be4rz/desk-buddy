[package]
name = "buddy-app"
description = "desk-buddy: the menu-bar app (Tauri 2 + native NSPanel bear), from spike S1"
version.workspace = true
edition.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = ["tray-icon", "image-png", "custom-protocol", "macos-private-api", "unstable"] }
serde.workspace = true
serde_json.workspace = true
libc = "0.2"
mascot-protocol.workspace = true
mascot-core.workspace = true
mascot-render = { path = "../mascot-render" }
bridge.workspace = true
host.workspace = true
policy.workspace = true
widgets.workspace = true
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-quartz-core = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"
objc2-web-kit = { version = "0.3", features = ["WKWebViewConfiguration", "objc2-app-kit"] }
objc2-io-surface = { version = "0.3", features = ["libc", "objc2-core-foundation"] }

[dev-dependencies]
# the IPC ACL test (widgets::acl): a mock runtime with the app's real capabilities
tauri = { version = "=2.12.4", features = ["test"] }
