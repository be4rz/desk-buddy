# desk-buddy workspace (plan §6).
[workspace]
resolver = "2"
members = ["crates/*", "spikes/s2-harness"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
repository = "https://github.com/be4rz/desk-buddy"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
getrandom = "0.3"
mascot-protocol = { path = "crates/mascot-protocol" }
mascot-core = { path = "crates/mascot-core" }
policy = { path = "crates/policy" }
bridge = { path = "crates/bridge" }
host = { path = "crates/host" }
widgets = { path = "crates/widgets" }
studio = { path = "crates/studio" }

# Lean dev builds (design §6.1): deps optimized as in S1, no full debuginfo.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
