[package]
name = "s1-window"
version = "0.0.0"
edition = "2021"
publish = false
description = "desk-buddy spike S1: mascot NSPanel + Tauri webview in one process"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = ["tray-icon", "image-png", "custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-quartz-core = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"
objc2-io-surface = { version = "0.3", features = ["libc", "objc2-core-foundation"] }

[profile.dev]
# one debug profile, optimised so the idle-CPU numbers are representative
opt-level = 2
[profile.dev.package."*"]
opt-level = 2
