version: 1
# desk-buddy is a native macOS desktop app (Tauri 2 + NSPanel), not a web app:
# there is no localhost URL. The runnable target is crates/buddy-app (menu-bar
# accessory, the bear on the desktop driven by mascot-core's brain).
# Visual review of the mascot is done on the real desktop by the user; agents
# verify through the checks below, BUDDY_STATS stderr and BUDDY_DUMP canvas PNGs
# (our own buffer, never a desktop screenshot).
# Every cargo command uses the one shared target dir (design §6.1):
#   export CARGO_TARGET_DIR=/Users/chantran/orca/desk-buddy/target
# and Tauri builds first check `df -k /` for >= 3 GB free.
target: native macOS app (crates/buddy-app), no HTTP endpoint
cwd: .
start: BUDDY_STATS=1 cargo run -p buddy-app   # prints "[buddy] fps … cpu …%" every 10 s
check: cargo test -p mascot-render -p buddy-app
services:
  buddy-app:
    cwd: .
    start: BUDDY_STATS=1 cargo run -p buddy-app
    check: cargo test -p mascot-render -p buddy-app
  senses:
    cwd: .
    # sensors (frontmost, idle, clock, fullscreen, screen share), reflexes, DND/quiet hours (AC4)
    check: cargo test -p mascot-core -p buddy-app && test -z "$(rg -n 'std::fs|File::' crates/buddy-app/src/senses)"
    start: BUDDY_STATS=1 BUDDY_SENSES_LOG=1 cargo run -p buddy-app   # "[buddy] senses …" on stderr only
  harness:
    cwd: .
    # root Cargo workspace (crates/* + spikes/s2-harness); bridge's e2e needs bun
    check: cargo test --workspace
    # one prompt through the harness against the fake: start the fake first
    # (bun agent/test/support/fake.ts --port <p> --script <file.json>), then:
    start: cargo build -p host --bin buddy && S2_HOME=<tmp> cargo run -p s2-harness -- --yes --fake http://127.0.0.1:<p> "<prompt>"
  talk:
    cwd: .
    # speech bubble + in-app harness (AC6); the fake model: bun agent/test/support/fake.ts --port 0 --script <file.json>
    check: cargo test -p buddy-app -p bridge -p host -p policy
    start: cargo build -p host --bin buddy && BUDDY_HOME=<tmp> BUDDY_FAKE_MODEL=http://127.0.0.1:<p> BUDDY_PROMPT="<prompt>" BUDDY_ANSWER=allow BUDDY_STATS=1 cargo run -p buddy-app
  accounts:
    cwd: .
    # keychain credentials, Sign in… window, unprompted budget (p4); tests use MemoryStore + the fake model/OAuth only
    check: cargo test -p bridge -p buddy-app -p mascot-protocol -p mascot-core && (cd agent && bun test test/scenarios/auth.test.ts)
    # debug build; no real keychain: BUDDY_CRED_STORE=memory (or =fail for the keychain-error path)
    start: BUDDY_HOME=<tmp> BUDDY_CRED_STORE=memory BUDDY_FAKE_OAUTH=1 BUDDY_FAKE_MODEL=http://127.0.0.1:<p> BUDDY_STATS=1 cargo run -p buddy-app
  agent-sidecar:
    cwd: agent
    # needs bun; builds dist/buddy-agent (~68 MB) and runs it against the scripted fake model
    check: bun run typecheck && bun test
  mascot-pipeline:
    cwd: experiments/mascot/bear3d
    # full rebuilds need Blender (BLENDER=/Applications/Blender.app/Contents/MacOS/Blender): sh run.sh / run_anim.sh / run_b.sh
    # verify_face.py arrives with the art round (p2)
    check: python3 verify_b.py && { [ ! -f verify_face.py ] || python3 verify_face.py; }
flows: >-
  primary: BUDDY_STATS=1 BUDDY_EVENTS=crates/buddy-app/tests/fixtures/events.jsonl BUDDY_DUMP=$TMPDIR/dump cargo run -p buddy-app
  for 60 s: the bear appears (menu-bar accessory, no Dock icon), stderr logs "[buddy] intent …" for the brain's
  intents from the events, idle CPU < 1% in the stats lines, dumps show more than one behavior (Pillow contact sheet);
  tray: Zoom ×1/×2/×3 (persisted to BUDDY_HOME/settings.json), Hide/Show bear, Move to next display, Quit desk-buddy;
  error: BUDDY_PACK=/nonexistent cargo run -p buddy-app exits 1 with "[buddy] cannot load mascot pack";
  error: a corrupt BUDDY_HOME/settings.json → defaults, settings.json.bad kept, tray shows "⚠ Settings reset (see settings.json.bad)";
  senses: BUDDY_STATS=1 BUDDY_SENSES_LOG=1 cargo run -p buddy-app for 60 s prints "[buddy] senses {…}" lines (frontmost,
  idle, local, fullscreen, screen_share) to stderr, nothing under BUDDY_HOME but settings.json (and app.lock, host.json, agents/), idle CPU < 1%;
  tray: Do not disturb (bear hides, status "Hidden: do not disturb"), When busy ▸ Hold still (bear holds still, status
  "Still: …", dnd.action persisted), Quiet hours toggle (quiet_hours.enabled persisted);
  senses error: no window-server access (CGWindowList null) → not fullscreen / not sharing, logged once, no crash;
  pipeline: verify_b.py PASS after any change to experiments/mascot/out/bear3d/anim_b;
  harness: s2-harness prints mascot events thinking → awaiting_permission → working(buddy) → speaking → idle and a host "say" whose turn is the prompt's request id;
  talk: BUDDY_PROMPT="gated hi please" BUDDY_ANSWER=allow logs "[buddy] bubble show speech streaming" → "card" → "speech streaming" → "speech" → "bubble hide" (6 s later)
  and "[buddy] mouth Open/Wide/Closed" (BUDDY_STATS) while talking; `BUDDY_HOME=<tmp> buddy say "hello" --emotion happy` from a plain terminal exits 0
  and logs "[buddy] host say user (happy)"; parity: web/bubble/index.html?mock=<state> against the parent prototype's #bubble-* ids;
  talk error: BUDDY_ANSWER=deny → no "[buddy] host say"; app down → buddy say exits 1 "desk-buddy isn't running"; a model error → "bubble show error";
  no key → "⚠ Agent: not signed in" and a prompt shows the no_model error; SIGTERM (also after kill -9 of the sidecar) removes host.json;
  accounts: tray Sign in… → fake-oauth → "Signed in"; Add key stores to the keychain (MemoryStore in tests) and the field clears;
  parity: web/signin/index.html?mock=signin|signin-code|signin-error|signin-done|signin-signed-out against #signin, #signin-error, #signin-done,
  tray #tray-budget / #tray-budget-paused; a second launch logs "[buddy] already running (pid N)" and exits 0;
  accounts error: BUDDY_CRED_STORE=fail → tray "⚠ Agent: can't read keychain · …" line and no sidecar start; a wrong OAuth code → #signin-error (invalid_grant);
  a 5th sense candidate in an hour sends no prompt and stays 4/4; no key in ps eww of the sidecar or a command's env;
  release build: no BUDDY_CRED_STORE / BUDDY_FAKE_OAUTH / fake-oauth / ANTHROPIC_API_KEY strings in target/release/buddy-app;
  harness error: a denied card never reaches the host; a model error ends in an "error" event and exit 1; kill -9 mid-tool restarts with an "interrupted" entry
